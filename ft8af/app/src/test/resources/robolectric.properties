# Pin Robolectric's Android runtime to API 35 regardless of the app's targetSdk.
#
# The app targets API 36 (Android 16) so Google Play accepts the upload, but
# Robolectric 4.14.1 only ships an android-all runtime up to API 35 — letting it
# default to the manifest targetSdk (36) fails every RobolectricTestRunner test
# with "Robolectric does not support API level 36". The first version that does
# support 36 is 4.16, and it requires JDK 21 to run the API-36 runtime; the whole
# build (and the Android Studio JBR / CI) is on JDK 17. Pinning to 35 keeps the
# unit tests running on JDK 17 while the shipped app still targets 36. Framework
# behaviour we exercise in tests (MaidenheadGrid, Ft8Message, GenerateFT8, QRZ,
# grid/geometry math) is unaffected by the target bump, so API 35 stays
# representative. Raise this to 36 once we move to Robolectric >= 4.16 + JDK 21.
sdk=35

import java.text.DateFormat
import java.text.SimpleDateFormat

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // Kotlin 2.0 Compose compiler plugin (issue #440). Replaces the standalone
    // composeOptions.kotlinCompilerExtensionVersion, which the Kotlin 1.9
    // toolchain used and which topped out at Compose 1.7.
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'jacoco'
    // Static analysis (issue #63).
    id 'io.gitlab.arturbosch.detekt'
    id 'org.jlleitschuh.gradle.ktlint'
}

def currentTime = getCurrentTime()

static def getCurrentTime() {
    DateFormat df = new SimpleDateFormat("yyyy-MM-dd")
    return df.format(Calendar.getInstance(Locale.US).getTime())
}


android {

    compileSdk 35

    defaultConfig {
        applicationId "radio.ks3ckc.ft8af"
        minSdk 23
        targetSdk 35
        // Required for the androidTest suite to actually run: our instrumented
        // tests use @RunWith(AndroidJUnit4::class). Without this, AGP falls back
        // to the legacy android.test.InstrumentationTestRunner, which discovers
        // none of them — connectedDebugAndroidTest then reports "Starting 0
        // tests" and passes vacuously (a false green).
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // CI builds derive versionCode from GITHUB_RUN_NUMBER + offset, so each
        // run gets a unique, monotonically increasing value Play Console will
        // accept. Local builds without the env var keep the static fallback so
        // debug/release builds run unchanged from a dev machine.
        //
        // GITHUB_RUN_NUMBER is PER-WORKFLOW-FILE, so it resets when the workflow
        // is renamed/split. The original build-release.yml reached run ~680
        // (versionCode ~780 on the Play internal track) before CI was split into
        // per-project workflows; the replacement android.yml started its own
        // counter back near 1, so the old +100 offset produced a versionCode
        // BELOW 780 and Play rejected the rollout ("does not allow any existing
        // users to upgrade to the newly added APKs"). The +1000 offset clears
        // that historical max with margin. If the workflow is ever split/renamed
        // again (resetting the counter), bump this offset past the last
        // published versionCode once more.
        def ciRunNumber = System.getenv("GITHUB_RUN_NUMBER")
        versionCode ciRunNumber ? (ciRunNumber.toInteger() + 1000) : 5
        // CI passes -PVERSION_NAME_OVERRIDE derived from the git tag (v1.1.0 ->
        // "1.1.0", dev-42 -> "1.1.0-dev.42"). Local builds use the fallback.
        def ciVersionName = project.findProperty('VERSION_NAME_OVERRIDE')
        versionName ciVersionName ?: '1.1.0'


        externalNativeBuild {
            cmake {
                // No extra cppFlags — all native code (the FT8 DSP core plus the
                // USB audio glue) builds from source via src/main/cpp/CMakeLists.txt
                // into libft8af.so, and that build needs nothing beyond the
                // defaults. The upstream FT8CN's '-JENABLE_XOM=false' was a typo
                // (likely intended -D, not -J) that clang rejects, so it stays out.
                cppFlags ''
            }
        }

        // Native code is built from source (see src/main/cpp/CMakeLists.txt) into
        // libft8af.so; there are no prebuilt jniLibs. This filter just limits the
        // NDK build to the four ABIs we ship and prevents an unexpected ABI
        // slipping in.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
        }
    }

    signingConfigs {
        // Release signing is opt-in via project properties (typically declared in
        // ~/.gradle/gradle.properties or via -P flags on the command line). If those
        // properties are absent the release build produces an unsigned APK rather than
        // silently falling back to the debug key.
        if (project.hasProperty('RELEASE_STORE_FILE')) {
            release {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {

        debug{
            versionNameSuffix '-dev'
            buildConfigField("String", "apkBuildTime", "\"${currentTime}\"")
        }
        release {
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
            // R8 shrink + obfuscate. proguard-rules.pro keeps the JNI surface the
            // native libft8af.so reaches by name (Ft8Message fields, the
            // UsbAudioNative callback) plus the reflection-driven USB serial driver
            // discovery and the AWS Cognito SDK. minifyEnabled also makes AGP emit
            // mapping.txt, which CI uploads to Play Console for deobfuscated crashes.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField("String", "apkBuildTime", "\"${currentTime}\"")

        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        dataBinding true
        buildConfig true
    }
    // composeOptions.kotlinCompilerExtensionVersion is intentionally gone: with
    // Kotlin 2.0 the Compose compiler is the org.jetbrains.kotlin.plugin.compose
    // plugin (applied above, versioned to match Kotlin in the root build.gradle).
    testOptions {
        unitTests {
            // Robolectric needs the merged manifest + resources to bring up an
            // Android runtime; returnDefaultValues keeps unmocked framework
            // calls (e.g. android.util.Log) from throwing in pure-JVM tests.
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
            kotlin.srcDirs = ['src/main/kotlin']
        }
        test {
            java.srcDirs = ['src/test/java']
            kotlin.srcDirs = ['src/test/kotlin']
            resources.srcDirs = ['src/test/resources']
        }
        androidTest {
            java.srcDirs = ['src/androidTest/java']
            kotlin.srcDirs = ['src/androidTest/kotlin']
        }
    }
    namespace 'com.k1af.ft8af'
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.5.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.5.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.navigation:navigation-fragment:2.5.3'
    implementation 'androidx.navigation:navigation-ui:2.5.3'
    implementation 'com.google.android.gms:play-services-maps:18.1.0'

    implementation 'com.google.guava:guava:31.1-android'//Used for HashTable (multi-key HashMap)

    implementation files('src/libs/MPAndroidChartv_3.1.0.jar')
    implementation files('src/libs/commons-net-3.6.jar')////Used for time synchronization
    implementation files('src/libs/nanohttpd-2.2.0.jar')
    implementation files('src/libs/osmdroid-android-6.1.14.aar')//Map widget

    // Compose BOM — 2025.04.01 maps to Compose 1.8.0 (issue #440). activity- and
    // navigation-compose are versioned outside the BOM, so they are bumped to the
    // releases that align with Compose 1.8 / Kotlin 2.0.
    def composeBom = platform('androidx.compose:compose-bom:2025.04.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.navigation:navigation-compose:2.8.9'
    implementation 'androidx.compose.runtime:runtime-livedata'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Android Auto (phone projection) templated status screen. 1.4.0 is the last
    // stable line compatible with AGP 8.7.3 / Kotlin 1.9.22; its minSdk (23) matches ours.
    implementation 'androidx.car.app:app:1.4.0'

    // Image loading for QRZ profile avatars
    implementation 'io.coil-kt:coil-compose:2.6.0'

    // AWS Cognito user-pool SRP login — used only to mint a pota.app ID token for
    // in-app POTA log upload (POST api.pota.app/adif). POTA's user pool/client IDs
    // are public (shipped in pota.app's JS). cognitoidentityprovider pulls in
    // aws-android-sdk-core transitively; no other AWS modules are needed.
    implementation 'com.amazonaws:aws-android-sdk-cognitoidentityprovider:2.76.0'

    // Keystore-backed EncryptedSharedPreferences for the POTA refresh token —
    // a long-lived credential that must not sit in plaintext app storage.
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // --- JVM unit + Robolectric tests ---
    testImplementation 'junit:junit:4.13.2'
    // 4.14.1 ships android-all for SDK 35; older versions fail with
    // IllegalArgumentException during RobolectricTestRunner init.
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.test.ext:junit:1.1.5'
    testImplementation 'com.google.truth:truth:1.4.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'androidx.compose.ui:ui-test-junit4'

    // ui-test-manifest must be debug-scoped: the merged debug manifest is what
    // hosts ComponentActivity for createComposeRule(). testImplementation
    // wouldn't surface it during the unit-test build.
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // --- Connected (instrumented) tests ---
    // The compose BOM is on `implementation`, which does NOT flow into the
    // androidTest classpath (unlike testImplementation), so the versionless
    // ui-test-junit4 below resolves to no version and fails. Apply the BOM here
    // too so it gets the same managed version the main + unit-test classpaths do.
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    // AppSmokeTest asserts with Truth (assertThat). Truth is on testImplementation
    // for the JVM unit tests but does not flow into the androidTest classpath, so
    // the instrumented build needs its own copy or compileDebugAndroidTestKotlin
    // fails with "Unresolved reference: truth".
    androidTestImplementation 'com.google.truth:truth:1.4.2'
    // GrantPermissionRule (AppSmokeTest) lives in androidx.test:rules. 1.6.1
    // aligns with the androidx.test:monitor:1.6.1 already on the classpath.
    androidTestImplementation 'androidx.test:rules:1.6.1'
}

jacoco {
    toolVersion = '0.8.12'
}

// --- Static analysis (issue #63) ---
//
// Both tools fail their own task on a NEW violation so a developer running
// them locally gets a clear signal. CI keeps them warn-only during the rollout
// (see .github/workflows/static-analysis.yml) by not gating on the step; the
// flip to blocking is a one-line change there.

detekt {
    // Layer our correctness-only overrides on top of detekt's bundled defaults.
    buildUponDefaultConfig = true
    config.setFrom(files("$projectDir/config/detekt/detekt.yml"))
    // Existing findings are recorded here so only new code is policed.
    baseline = file("$projectDir/config/detekt/baseline.xml")
    parallel = true
}

ktlint {
    version = '1.2.1'
    android = true
    // Reports for CI to upload as artifacts.
    reporters {
        reporter org.jlleitschuh.gradle.ktlint.reporter.ReporterType.PLAIN
        reporter org.jlleitschuh.gradle.ktlint.reporter.ReporterType.HTML
    }
}

// Robolectric loads app classes through its own classloader, which JaCoCo's
// agent reports as "no location". Without includeNoLocationClasses the coverage
// executed by every Robolectric test (MaidenheadGrid, Ft8Message, GenerateFT8,
// the QRZ suites, …) is silently dropped from the report. The jdk.internal
// exclude avoids an InstrumentationException on Java 17.
tasks.withType(Test).configureEach {
    jacoco {
        includeNoLocationClasses = true
        excludes = ['jdk.internal.*']
    }
}

tasks.register('jacocoTestReport', JacocoReport) {
    dependsOn 'testDebugUnitTest'

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    def excludes = [
            '**/R.class',
            '**/R$*.class',
            '**/BuildConfig.*',
            '**/Manifest*.*',
            '**/*Test*.*',
            '**/*$ViewBinder*.*',
            '**/*$ViewInjector*.*',
            '**/*Binding.*',
            '**/*BindingImpl.*',
            '**/DataBinderMapperImpl.*',
            '**/BR.*',
            '**/*ComposableSingletons*.*'
    ]

    classDirectories.setFrom(files(
            fileTree(dir: layout.buildDirectory.dir('intermediates/javac/debug/classes').get().asFile, excludes: excludes),
            fileTree(dir: layout.buildDirectory.dir('tmp/kotlin-classes/debug').get().asFile, excludes: excludes)
    ))
    sourceDirectories.setFrom(files('src/main/java', 'src/main/kotlin'))
    executionData.setFrom(fileTree(dir: layout.buildDirectory.get().asFile, includes: [
            'jacoco/testDebugUnitTest.exec',
            'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec'
    ]))
}

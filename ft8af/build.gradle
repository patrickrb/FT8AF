// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    // AGP 8.7.x: needed for 16 KB page-size support. AGP only 16 KB-aligns
    // uncompressed native libraries inside the APK/AAB from 8.5.1 onward
    // (earlier versions zip-align them to 4 KB), which made Google Play flag
    // the bundle even though the .so ELF segments are already 16 KB-aligned
    // via the linker's -Wl,-z,max-page-size=16384 flag (see app/src/main/cpp/CMakeLists.txt).
    id 'com.android.application' version '8.7.3' apply false
    id 'com.android.library' version '8.7.3' apply false
    // Kotlin 2.0 / K2 (issue #440). Compose 1.8 requires the compiler that ships
    // inside Kotlin 2.x, so the standalone kotlinCompilerExtensionVersion is gone
    // and the Compose compiler is now the org.jetbrains.kotlin.plugin.compose
    // plugin, whose version MUST track the Kotlin version below.
    id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.21' apply false
    // Static analysis (issue #63). Applied in app/build.gradle; declared here
    // with apply false so the versions resolve once for the whole build. These
    // are the Gradle *plugin* versions: detekt 1.23.8 and the ktlint plugin
    // 12.1.2 are the first releases that run against a Kotlin 2.0 build without
    // the embedded-compiler mismatch that fails the build. The ktlint *engine*
    // itself stays pinned to 1.2.1 in app/build.gradle — it parses the Kotlin
    // 2.0 sources cleanly, so no engine bump is needed.
    id 'io.gitlab.arturbosch.detekt' version '1.23.8' apply false
    id 'org.jlleitschuh.gradle.ktlint' version '12.1.2' apply false
    // Sentry crash reporting (opt-in). The Gradle plugin is applied in
    // app/build.gradle purely to upload the R8 mapping file so release stack
    // traces deobfuscate in Sentry; the SDK itself is a normal dependency and
    // is initialised manually (see crash/CrashReporting.kt). Plugin 5.x pairs
    // with SDK 8.x.
    id 'io.sentry.android.gradle' version '5.8.0' apply false
}
task clean(type: Delete) {
    delete rootProject.buildDir
}

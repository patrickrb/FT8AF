name: FT8AF
options:
  bundleIdPrefix: radio.ks3ckc
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

packages:
  FT8AFKit:
    path: ../FT8AFKit

targets:
  FT8AF:
    type: application
    platform: iOS
    sources:
      - FT8AF
    # Explicit Info.plist (generated by XcodeGen) instead of Xcode's
    # GENERATE_INFOPLIST_FILE + INFOPLIST_KEY_* settings, because UIAppFonts
    # has no INFOPLIST_KEY_ equivalent. Every previous INFOPLIST_KEY_* value
    # is carried over below.
    info:
      path: FT8AF/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        NSMicrophoneUsageDescription: "FT8AF needs microphone access to capture radio audio for FT8 decoding"
        NSLocalNetworkUsageDescription: "FT8AF uses the local network to send WSJT-X UDP messages to companion apps like GridTracker and JTAlert"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - inter_variable.ttf
          - geist_mono_regular.ttf
          - geist_mono_medium.ttf
          - geist_mono_semibold.ttf
          - geist_mono_bold.ttf
    settings:
      base:
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: radio.ks3ckc.ft8af
    dependencies:
      - package: FT8AFKit
        product: FT8DSP
      - package: FT8AFKit
        product: FT8Audio
      - package: FT8AFKit
        product: FT8Engine
      - package: FT8AFKit
        product: FT8Rig
      - sdk: Accelerate.framework

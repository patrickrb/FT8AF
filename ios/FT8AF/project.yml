name: FT8AF
options:
  bundleIdPrefix: radio.ks3ckc
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

packages:
  FT8AFKit:
    path: ../FT8AFKit

targets:
  FT8AF:
    type: application
    platform: iOS
    sources:
      - FT8AF
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SWIFT_VERSION: "5.9"
        PRODUCT_BUNDLE_IDENTIFIER: radio.ks3ckc.ft8af
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "FT8AF needs microphone access to capture radio audio for FT8 decoding"
    dependencies:
      - package: FT8AFKit
        product: FT8DSP
      - package: FT8AFKit
        product: FT8Audio
      - package: FT8AFKit
        product: FT8Engine
      - package: FT8AFKit
        product: FT8Rig
      - sdk: Accelerate.framework

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ft8af-band-advisor"
version = "0.1.0"
description = "FT8AF Band Advisor: VOACAP + PSK Reporter aggregation and band recommendation API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary (invokes GPL voacapl as an external tool; see README)" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "defusedxml>=0.7,<1.0",
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

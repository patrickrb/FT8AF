name: iOS CI

# iOS pipeline for the ios/ port. Runs the FT8AFKit host test suites
# (FT8DSP/FT8Audio/FT8Engine/FT8Rig — the encode/decode/golden gate compiled
# under Apple clang) and an unsigned iOS-Simulator build of the FT8AF app to
# prove it compiles. No release artifact: a distributable .ipa needs an Apple
# Developer cert + provisioning profile, which aren't wired up yet.
#
# PATH-FILTERED: only runs when ios/** or the shared native C core
# (ft8af/app/src/main/cpp/**) changes, or this workflow file. Pushes to
# staging/main always verify. The always-run `ios-gate` job is the required
# status check. iOS has no release artifact yet (CI build/test only), so the
# staging/main split only affects when the verify runs.

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging, dev]

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect iOS changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ios:
              - 'ft8af/app/src/main/cpp/**'
              - 'ios/**'
              - '.github/workflows/ios.yml'

      - name: Decide whether to run
        id: decide
        env:
          CHANGED: ${{ steps.filter.outputs.ios }}
        run: |
          set -euo pipefail
          # staging/main pushes always verify; otherwise only when iOS-relevant
          # files (or the shared C core) changed.
          if [[ "$GITHUB_EVENT_NAME" == "push" && ( "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == "refs/heads/staging" ) ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$CHANGED" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: swift test + simulator build
    needs: detect
    if: ${{ needs.detect.outputs.run == 'true' }}
    # macos-15 ships Xcode 16. Current XcodeGen (2.45.x) always writes the
    # pbxproj in the Xcode 16 object format (objectVersion 77), which Xcode 15
    # refuses to open ("future Xcode project file format (77)"), so the
    # simulator build needs Xcode 16 to read the generated project. The app's
    # iOS 17 deployment target still builds fine under the newer toolchain.
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # FT8AFKit declares a macOS platform so its pure-logic suites run on the
      # host with no simulator. This is the real DSP gate: green here means the
      # shared C core (#included in place from ../../ft8af/app/src/main/cpp) is
      # bit-identical under Apple clang. Surfaces the ios/README.md
      # header-search-path / non-modular-include caveats if any regress.
      - name: Run FT8AFKit tests
        working-directory: ios/FT8AFKit
        run: swift test --enable-code-coverage

      # Export the SwiftPM coverage run to lcov. swift test writes a merged
      # default.profdata plus the combined *PackageTests.xctest bundle under the
      # build bin dir; llvm-cov turns those into lcov for Codecov. .build (vendored
      # SwiftPM checkouts) is excluded so the ios flag reflects our own sources.
      - name: Export iOS coverage to lcov
        # Non-fatal: a coverage-export hiccup must never fail the required
        # ios-gate (mirrors the native/desktop coverage guards). If this or the
        # upload below no-ops, the simulator build still gates the PR.
        continue-on-error: true
        working-directory: ios/FT8AFKit
        run: |
          set -euo pipefail
          bin="$(swift build --show-bin-path)"
          prof="$bin/codecov/default.profdata"
          # Collect every test bundle's executable (usually one merged bundle).
          objs=()
          while IFS= read -r xctest; do
            objs+=("$xctest/Contents/MacOS/$(basename "${xctest%.xctest}")")
          done < <(find "$bin" -maxdepth 1 -name '*.xctest')
          if [[ ${#objs[@]} -eq 0 ]]; then
            echo "::error::No .xctest bundle found under $bin"; exit 1
          fi
          args=("${objs[0]}")
          for o in "${objs[@]:1}"; do args+=("-object" "$o"); done
          xcrun llvm-cov export -format=lcov -instr-profile "$prof" \
            --ignore-filename-regex='\.build/' \
            "${args[@]}" > ios.lcov
          echo "Wrote $(wc -l < ios.lcov) lines of lcov."

      - name: Upload iOS coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ios/FT8AFKit/ios.lcov
          flags: ios

      # The app's .xcodeproj is generated from project.yml via XcodeGen and no
      # shared scheme is committed, so regenerate it to get a buildable scheme.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/FT8AF
        run: xcodegen generate

      # Unsigned simulator build — proves the SwiftUI app + FT8AFKit link and
      # compile. CODE_SIGNING_ALLOWED=NO so no certs/provisioning are needed.
      - name: Build app for iOS Simulator (unsigned)
        working-directory: ios/FT8AF
        run: |
          set -euo pipefail
          xcodebuild build \
            -project FT8AF.xcodeproj \
            -scheme FT8AF \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

  ios-gate:
    name: ios-gate
    # Always-run aggregator: the single required status check for iOS. Reports
    # success when `verify` passed OR was path-skipped, so branch protection
    # never gets stuck "pending" on an unrelated change. Depends on `detect`
    # too: a `detect` failure skips `verify`, and a skip alone would otherwise
    # be read as "nothing to do" and pass the gate — so its result is checked.
    needs: [detect, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify iOS jobs succeeded or were skipped
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          set -euo pipefail
          for r in "$DETECT_RESULT" "$VERIFY_RESULT"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::An iOS job did not pass (detect=$DETECT_RESULT verify=$VERIFY_RESULT)"
              exit 1
            fi
          done
          echo "iOS gate OK (detect=$DETECT_RESULT verify=$VERIFY_RESULT)."

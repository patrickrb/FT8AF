name: Discord — merge notify

on:
  push:
    branches: [dev, staging, main]

jobs:
  notify:
    runs-on: ubuntu-latest
    # Skip if the head commit message contains [skip discord] (e.g. for state-branch chores)
    if: ${{ !contains(github.event.head_commit.message, '[skip discord]') }}
    steps:
      - name: Post to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          COMPARE_URL: ${{ github.event.compare }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "${WEBHOOK_URL:-}" ]]; then
            echo "::error::DISCORD_WEBHOOK_URL secret is not set"
            exit 1
          fi
          if [[ "$BRANCH" == "main" ]]; then
            color=3066993   # green — production release
            emoji="🚀"
          elif [[ "$BRANCH" == "staging" ]]; then
            color=3447003   # blue — dev (prerelease) build cut
            emoji="📦"
          else
            color=15105570  # orange — landed on dev
            emoji="🔧"
          fi
          sha_short="${SHA:0:7}"
          first_line=$(printf '%s' "$COMMIT_MSG" | head -n1)
          body=$(printf '%s' "$COMMIT_MSG" | tail -n +2 | sed -E '/^[[:space:]]*$/d' || true)
          # Discord embed limits: title <= 256 chars, description <= 4096 chars.
          # A large squash-merge commit body overruns description -> HTTP 400, so
          # clamp both fields (with an ellipsis) before building the payload.
          payload=$(jq -nc \
            --arg branch  "$BRANCH" \
            --arg sha     "$sha_short" \
            --arg first   "$first_line" \
            --arg body    "$body" \
            --arg author  "$AUTHOR" \
            --arg url     "$COMMIT_URL" \
            --arg compare "$COMPARE_URL" \
            --arg repo    "$REPO" \
            --arg emoji   "$emoji" \
            --argjson color "$color" \
            'def clamp(max): if (.|length) > max then (.[0:max-1] + "…") else . end;
             {embeds:[{
               title: (($emoji + " " + $repo + " — merged into " + $branch + ": " + $first) | clamp(256)),
               url: $url,
               color: $color,
               description: (if $body == "" then null else ($body | clamp(4096)) end),
               fields: [
                 {name:"Commit",  value:("[`"+$sha+"`]("+$url+")"), inline:true},
                 {name:"Author",  value:$author, inline:true},
                 {name:"Compare", value:("["+$sha+"]("+$compare+")"), inline:true}
               ]
             }]}')
          curl -fsS -H "Content-Type: application/json" -d "$payload" "$WEBHOOK_URL"

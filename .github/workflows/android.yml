name: Android CI & Release

# Android pipeline for the ft8af/ app: unit tests + coverage, instrumented
# emulator tests, static analysis (lint/detekt/ktlint), and the signed
# APK/AAB build + GitHub Release + Play internal publish.
#
# PATH-FILTERED: on pull requests and dev pushes this whole pipeline only runs
# when Android-relevant files change (ft8af/** — which includes the shared
# native C core at ft8af/app/src/main/cpp/ — or this workflow file). Pushes to
# main and v* tags always build (a full per-version release snapshot,
# regardless of what changed). The always-run `android-gate` job is the single
# required status check so branch protection never gets stuck "pending" when the
# build jobs are path-skipped.

on:
  push:
    branches: [main, dev]
    tags:
      - 'v*'
  pull_request:
    branches: [main, dev]

permissions:
  contents: write

# Google Play allows only one active "edit" per app, so two release builds
# publishing at once make the second fail with "This edit has expired, please
# create a new Edit." Serialize the release-publishing runs (pushes to dev/main
# and v* tags) into a single queue so they never overlap on the Play API.
# cancel-in-progress is false so an in-flight publish finishes rather than being
# killed mid-upload. Pull request runs get a unique group keyed to run id, so
# they never queue and CI stays fast.
concurrency:
  group: >-
    ${{
      (github.event_name == 'push'
        && (github.ref == 'refs/heads/main'
          || github.ref == 'refs/heads/dev'
          || startsWith(github.ref, 'refs/tags/v')))
      && 'play-publish'
      || format('build-{0}', github.run_id)
    }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect Android changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            android:
              - 'ft8af/**'
              - '.github/workflows/android.yml'

      - name: Decide whether to run
        id: decide
        env:
          CHANGED: ${{ steps.filter.outputs.android }}
        run: |
          set -euo pipefail
          # main pushes and v* tags always build the full release; otherwise
          # build only when Android-relevant files changed.
          if [[ "$GITHUB_EVENT_NAME" == "push" && ( "$GITHUB_REF" == "refs/heads/main" || "$GITHUB_REF" == refs/tags/v* ) ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$CHANGED" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Unit tests & coverage
    needs: detect
    if: ${{ needs.detect.outputs.run == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('ft8af/**/*.gradle*', 'ft8af/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ft8af/gradlew

      - name: Pre-install NDK (retry around flaky SDK downloads)
        run: |
          set -euo pipefail
          NDK_VERSION=25.1.8937393
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          MARKER="$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"
          for attempt in 1 2 3; do
            echo "::group::NDK install attempt $attempt"
            rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION" "$HOME/.android/cache"
            yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION" || true
            echo "::endgroup::"
            if [[ -f "$MARKER" ]]; then
              echo "NDK $NDK_VERSION ready at $ANDROID_HOME/ndk/$NDK_VERSION"
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 10s..."
            sleep 10
          done
          echo "::error::Failed to install NDK $NDK_VERSION after 3 attempts"
          exit 1

      - name: Run unit tests
        working-directory: ft8af
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Generate coverage report
        working-directory: ft8af
        run: ./gradlew jacocoTestReport --stacktrace

      - name: Upload coverage to Codecov
        continue-on-error: true
        id: codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ft8af/app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml

      - name: Upload test reports on failure
        if: steps.codecov.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            ft8af/app/build/reports/tests/
            ft8af/app/build/test-results/
            ft8af/app/build/reports/jacoco/

  instrumented:
    name: Instrumented tests (emulator)
    # Exercises the androidTest suite (AppSmokeTest launches the real
    # ComposeMainActivity) on an emulator. Same trigger as the unit-test job:
    # every Android-affected PR plus pushes to main. This job is intentionally
    # NOT part of android-gate and is left out of branch protection's required
    # checks while it stabilises (issue #60) — a flaky emulator must never block
    # a release.
    needs: detect
    if: ${{ needs.detect.outputs.run == 'true' && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('ft8af/**/*.gradle*', 'ft8af/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ft8af/gradlew

      # Hardware acceleration (KVM) is required for a usable x86_64 emulator on
      # the GitHub-hosted Ubuntu runners; without it the AVD falls back to slow
      # software rendering and connectedAndroidTest reliably times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Pre-build the app + androidTest APKs (and resolve all dependencies)
      # BEFORE booting the emulator. The androidTest classpath pulls espresso /
      # hamcrest from Maven Central, which rate-limits the shared GitHub runner
      # IPs (transient HTTP 429). Doing it here, with a retry+backoff, means a
      # 429 is retried cheaply instead of wasting a full emulator boot; the
      # emulator step then runs against already-cached dependencies.
      - name: Assemble instrumented test APKs
        working-directory: ft8af
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace; then
              exit 0
            fi
            echo "::warning::Gradle assemble failed (attempt ${attempt}/3) — retrying after backoff"
            sleep $((attempt * 30))
          done
          echo "::error::Gradle assemble failed after 3 attempts (likely Maven Central 429)"
          exit 1

      # google_apis image (not plain default) so Google Play services types the
      # app links against — play-services-maps — resolve at runtime and the
      # activity reaches RESUMED. API 30 matches the Compose UI test floor.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: Nexus 6
          working-directory: ft8af
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Stream test progress into the job log. By default
          # connectedDebugAndroidTest sits silently on a single "> Task" line
          # for minutes; backgrounding logcat's TestRunner tag (plus any
          # error-level lines) surfaces each test's started:/finished: events —
          # and any crash — live instead of leaving the step a black box.
          script: |
            adb logcat -c || true
            # TestRunner:I → each test's started:/finished:; AndroidRuntime:E and
            # *:F → real app crashes/uncaught exceptions. Deliberately NOT '*:E':
            # a fresh google_apis image floods error-level logs with unrelated
            # Play-services noise (Firebase, ConnectivityService) that buries the
            # test signal.
            adb logcat -s TestRunner:I AndroidRuntime:E '*:F' &
            logcat_pid=$!
            ./gradlew connectedDebugAndroidTest --stacktrace
            status=$?
            kill "$logcat_pid" 2>/dev/null || true
            exit $status

      - name: Upload instrumented test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports
          path: |
            ft8af/app/build/reports/androidTests/
            ft8af/app/build/outputs/androidTest-results/

  static-analysis:
    name: lint / detekt / ktlint
    # Issue #63: Android lint, detekt, and ktlint on PRs.
    #
    # ROLLOUT IS PHASED — every analysis step below is currently WARN-ONLY
    # (`continue-on-error: true`). CI runs the tool and uploads its report, but a
    # violation does NOT fail the check. To FLIP A TOOL TO BLOCKING: delete its
    # `continue-on-error: true` line. Do them one at a time.
    #
    # Notes on what already gates new code even in warn-only mode:
    #   - detekt runs against config/detekt/baseline.xml, so it only reports NEW
    #     correctness findings; the baseline holds the existing ones.
    #   - ktlint has no baseline yet — the existing codebase isn't formatted, so
    #     it will report many violations until a formatting pass lands.
    needs: detect
    if: ${{ needs.detect.outputs.run == 'true' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('ft8af/**/*.gradle*', 'ft8af/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ft8af/gradlew

      # --- WARN-ONLY during rollout: remove continue-on-error to make blocking ---

      - name: Android lint (debug)
        id: lint
        continue-on-error: true
        working-directory: ft8af
        run: ./gradlew lintDebug --stacktrace

      - name: detekt
        id: detekt
        continue-on-error: true
        working-directory: ft8af
        run: ./gradlew detekt --stacktrace

      - name: ktlint
        id: ktlint
        continue-on-error: true
        working-directory: ft8af
        run: ./gradlew ktlintCheck --stacktrace

      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: static-analysis-reports
          path: |
            ft8af/app/build/reports/lint-results-debug.html
            ft8af/app/build/reports/lint-results-debug.xml
            ft8af/app/build/reports/detekt/
            ft8af/app/build/reports/ktlint/
          if-no-files-found: ignore

  build:
    name: Build APK
    needs: [detect, test]
    # Run when Android is in scope (detect.run) AND tests passed (PR/main push) or
    # were skipped (push to dev/tags). Block only on actual test failure/cancel.
    if: ${{ always() && needs.detect.outputs.run == 'true' && needs.test.result != 'failure' && needs.test.result != 'cancelled' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Determine release tag
        id: tag
        run: |
          set -euo pipefail
          # Three release lanes (everything else is build-only):
          #   v* tag push  -> production-named release, NOT prerelease
          #   push to main -> auto-bumped v* tag, NOT prerelease
          #   push to dev  -> dev-<run_number> tag, PRERELEASE
          # Prereleases are still uploaded to Play internal but with a
          # distinct releaseName so they're easy to tell apart from the
          # v*-named candidates we'd actually promote to production.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "release_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "version_name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            # Auto-bump patch from latest v* tag.
            latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
            if [[ -z "$latest" ]]; then
              new_tag="v0.1"
            else
              version="${latest#v}"
              IFS='.' read -ra parts <<< "$version"
              last_idx=$((${#parts[@]} - 1))
              parts[$last_idx]=$((parts[$last_idx] + 1))
              new_tag="v$(IFS=.; echo "${parts[*]}")"
            fi
            echo "Latest tag: ${latest:-<none>} -> new tag: $new_tag"
            echo "release_tag=$new_tag" >> "$GITHUB_OUTPUT"
            echo "version_name=${new_tag#v}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/dev" ]]; then
            # dev pushes get a run-numbered tag and are flagged as prereleases.
            # Distinct prefix so they sort separately from v* in GitHub releases
            # and so the Play Console releaseName disambiguates them from
            # main-branch release candidates.
            new_tag="dev-${GITHUB_RUN_NUMBER}"
            # Derive the base semver from the latest v* tag so the APK version
            # reads e.g. "1.1.0-dev.42" instead of a bare run number.
            latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
            base_ver="${latest:+${latest#v}}"
            base_ver="${base_ver:-0.0.0}"
            echo "release_tag=$new_tag" >> "$GITHUB_OUTPUT"
            echo "version_name=${base_ver}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            # PR or other branch push — build only, no release
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "version_name=" >> "$GITHUB_OUTPUT"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('ft8af/**/*.gradle*', 'ft8af/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ft8af/gradlew

      - name: Pre-install NDK (retry around flaky SDK downloads)
        run: |
          set -euo pipefail
          # AGP auto-downloads this NDK during the native build, but its installer
          # aborts the whole build on the first corrupt/truncated archive from
          # Google's SDK server (java.util.zip.ZipException: Archive is not a ZIP
          # archive) with no retry — which intermittently broke PR builds (#208,
          # #212). Install it up front with retry and a clean slate between tries
          # so AGP finds it already present and never runs its fragile downloader.
          # Keep NDK_VERSION in sync with the AGP-default NDK (the version named in
          # that ZipException) if the Android Gradle Plugin is upgraded.
          NDK_VERSION=25.1.8937393
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # sdkmanager writes source.properties last, so its presence marks a
          # complete install — judge success by that, not the pipeline's exit
          # code: `yes` dies with SIGPIPE when sdkmanager closes the pipe, which
          # under `set -o pipefail` would otherwise read as a (false) failure.
          MARKER="$ANDROID_HOME/ndk/$NDK_VERSION/source.properties"
          for attempt in 1 2 3; do
            echo "::group::NDK install attempt $attempt"
            rm -rf "$ANDROID_HOME/ndk/$NDK_VERSION" "$HOME/.android/cache"
            yes | "$SDKMANAGER" --install "ndk;$NDK_VERSION" || true
            echo "::endgroup::"
            if [[ -f "$MARKER" ]]; then
              echo "NDK $NDK_VERSION ready at $ANDROID_HOME/ndk/$NDK_VERSION"
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 10s..."
            sleep 10
          done
          echo "::error::Failed to install NDK $NDK_VERSION after 3 attempts"
          exit 1

      - name: Decode keystore (release builds only)
        if: steps.tag.outputs.should_release == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK & AAB
        working-directory: ft8af
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          args=(assembleRelease)
          # Inject the version derived from the git tag / branch so the APK's
          # versionName matches the release without manual bumps in build.gradle.
          version_name="${{ steps.tag.outputs.version_name }}"
          if [[ -n "$version_name" ]]; then
            args+=("-PVERSION_NAME_OVERRIDE=$version_name")
          fi
          # Sign + produce AAB only on release builds — PR builds stay unsigned
          # because the keystore secret isn't available (and shouldn't be) for
          # fork PRs.
          if [[ -n "${RELEASE_STORE_FILE:-}" ]]; then
            args+=(bundleRelease \
              "-PRELEASE_STORE_FILE=$RELEASE_STORE_FILE" \
              "-PRELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD" \
              "-PRELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS" \
              "-PRELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD")
          fi
          ./gradlew "${args[@]}"

      - name: Rename APK
        if: steps.tag.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          cd ft8af/app/build/outputs/apk/release
          # Signed builds emit app-release.apk; unsigned emit app-release-unsigned.apk.
          # Keep the fallback so the rename works either way.
          if [[ -f app-release.apk ]]; then
            src=app-release.apk
          elif [[ -f app-release-unsigned.apk ]]; then
            src=app-release-unsigned.apk
          else
            echo "::error::No release APK found in $(pwd):" >&2
            ls -la >&2
            exit 1
          fi
          mv "$src" "FT8AF-${{ steps.tag.outputs.release_tag }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ft8af-release
          path: ft8af/app/build/outputs/apk/release/*.apk

      - name: Upload AAB artifact
        if: steps.tag.outputs.should_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ft8af-release-aab
          path: ft8af/app/build/outputs/bundle/release/*.aab

      # R8 mapping for the bundle. Kept as an artifact so a given release's
      # deobfuscation file is recoverable independently of Play Console.
      - name: Upload R8 mapping artifact
        if: steps.tag.outputs.should_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ft8af-release-mapping
          path: ft8af/app/build/outputs/mapping/release/mapping.txt

      - name: Create GitHub Release
        if: steps.tag.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          files: ft8af/app/build/outputs/apk/release/FT8AF-*.apk
          generate_release_notes: true
          # dev-* releases are flagged as prerelease so they sort under the
          # latest v* and don't get picked up by downstream tooling that
          # looks for "latest release".
          prerelease: ${{ steps.tag.outputs.is_prerelease == 'true' }}
          append_body: true
          body: |

            ---
            Vibecoded with spite on I-70 enroute to Dayton Hamvention.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishing to Play is a best-effort DEPLOY side-effect, not a build
      # signal — by this point the signed APK/AAB is already built and the
      # GitHub Release is published. The Play Internal upload can still fail on
      # external Play Console track state outside CI's control (e.g. "You cannot
      # rollout this release because it does not allow any existing users to
      # upgrade to the newly added APKs", or an expired edit when two releases
      # race). Those must NOT turn the build job red and block android-gate /
      # the dev→main PR. So continue-on-error here (mirroring the Codecov upload
      # above) and surface a warning in the next step instead. A genuinely
      # broken build fails earlier, in "Build APK & AAB".
      - name: Publish AAB to Play Internal track
        id: play_publish
        if: steps.tag.outputs.should_release == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: radio.ks3ckc.ft8af
          releaseFiles: ft8af/app/build/outputs/bundle/release/app-release.aab
          # R8 deobfuscation mapping — clears the Play Console "no deobfuscation
          # file" warning and makes crash/ANR stack traces readable.
          mappingFile: ft8af/app/build/outputs/mapping/release/mapping.txt
          track: internal
          status: completed
          releaseName: ${{ steps.tag.outputs.release_tag }}

      # Make a swallowed publish failure visible (annotation on the run) without
      # failing the job — the artifact + GitHub Release already succeeded.
      - name: Warn if Play publish failed
        if: steps.tag.outputs.should_release == 'true' && steps.play_publish.outcome == 'failure'
        run: |
          echo "::warning::Play Internal publish failed for ${{ steps.tag.outputs.release_tag }} (non-blocking). The signed AAB built and the GitHub Release was created; only the Play upload did not complete. Check the 'Publish AAB to Play Internal track' step log — common causes are an upgrade-path rejection or an expired Play edit."

  android-gate:
    name: android-gate
    # Always-run aggregator: the single required status check for Android.
    # Because the build jobs above are path-skipped on unrelated changes, this
    # job (which always runs) reports the overall Android result so branch
    # protection never gets stuck "pending". It fails only if a REQUIRED job
    # actually failed/cancelled. `instrumented` and `static-analysis` are
    # deliberately excluded — instrumented is flaky (issue #60) and static
    # analysis is warn-only during rollout — so neither can block a merge.
    # `detect` is included: a `detect` failure skips `test`/`build`, and a skip
    # alone would otherwise be read as "nothing to do" and pass the gate — so
    # its result is checked directly.
    needs: [detect, test, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required Android jobs succeeded or were skipped
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          for r in "$DETECT_RESULT" "$TEST_RESULT" "$BUILD_RESULT"; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::A required Android job did not pass (detect=$DETECT_RESULT test=$TEST_RESULT build=$BUILD_RESULT)"
              exit 1
            fi
          done
          echo "Android gate OK (detect=$DETECT_RESULT test=$TEST_RESULT build=$BUILD_RESULT)."

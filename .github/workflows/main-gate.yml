name: Main branch source gate

# Promotion path: feature -> dev -> main (the staging branch is retired).
#
# PRs into `main` must come from `dev` in this repo. Merging dev -> main is the
# release: android.yml publishes the build to the Play internal track and
# desktop.yml cuts a desktop prerelease. Production stays a separate,
# deliberate step that only Patrick takes.
#
# The same check reports under two names. `enforce-source-is-dev` is the real
# one. `enforce-source-is-staging` is the name main's branch protection
# required while staging existed; it runs the identical dev rule so that
# protection keeps working until the required context is swapped
# (Settings -> Branches -> main -> require "enforce-source-is-dev", drop
# "enforce-source-is-staging"). Delete the alias after that.
#
# Trigger stays `pull_request`: main's own copy of this file used it, and a
# dev -> main PR must be able to run the gate while main still carries the old
# copy. The job only reads event metadata and checks out nothing.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  enforce-source:
    name: ${{ matrix.check }}
    strategy:
      matrix:
        check: [enforce-source-is-dev, enforce-source-is-staging]
    runs-on: ubuntu-latest
    steps:
      - name: Check PR head branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The branch name alone isn't enough: a fork could open a PR from a
          # branch literally named "dev". Pin the head repo too.
          if [[ "$HEAD_REPO" != "$BASE_REPO" ]]; then
            echo "::error title=PR source must be this repo::PRs to main must come from dev in $BASE_REPO, not a fork ($HEAD_REPO)."
            exit 1
          fi
          if [[ "$HEAD_REF" != "dev" ]]; then
            echo "::error title=PR source must be dev::PRs to main are only allowed from dev (got '$HEAD_REF')."
            echo "Land the change on dev first (PR feature -> dev), then open dev -> main to release."
            exit 1
          fi
          echo "OK — PR source is dev in $BASE_REPO."
